name: Test and Coverage

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]

jobs:
  test-and-coverage:
    permissions:
      contents: read
      statuses: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # pin@v6.0.0
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven
          server-id: 'github'
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Check code formatting
        run: mvn spotless:check
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

      - name: Pull testcontainer images
        run: >-
          docker pull 'docker.elastic.co/elasticsearch/elasticsearch:9.5.2'
          && docker pull 'postgres:16.15'
          && docker pull 'testcontainers/ryuk:0.14.0'

      - name: Run tests with coverage
        run: mvn clean test
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # pin@v2.3.8
        with:
          fail-on-error: false

  container-scan:
    permissions:
      contents: read
    uses: felleslosninger/github-workflows/.github/workflows/ci-spring-boot-container-scan.yml@main
    with:
      java-version: 25
      trivy-os-disable-scan: true
      maven-skip-tests: true
    secrets: inherit
